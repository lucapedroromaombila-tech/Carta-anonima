<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Surpresa para Ti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Fundo preto espacial profundo */
            background: #060608;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            position: relative;
        }
        /* Efeito cósmico de estrelas ao fundo */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 0);
            background-size: 32px 32px;
            opacity: 0.2;
            pointer-events: none;
        }
        .container {
            /* Vidro translúcido escuro premium (Glassmorphism) */
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 35px;
            border-radius: 28px;
            border: 1px solid rgba(255, 77, 109, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 77, 109, 0.15);
            max-width: 92%;
            width: 430px;
            z-index: 10;
        }
        h1 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 0.8px;
            transition: all 0.8s ease;
        }
        #conteudo-secreto {
            color: #e5e5e7;
            font-size: 16.5px;
            line-height: 1.75;
            text-align: left; /* Alinhado à esquerda para parecer uma carta real */
            min-height: 200px;
        }
        .destaque {
            color: #ff4d6d;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
        }
        .assinatura {
            display: block;
            margin-top: 30px;
            font-size: 16px;
            color: #ff4d6d;
            font-weight: 500;
            text-align: right;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(255, 77, 109, 0.7);
            opacity: 0;
        }
        .btn {
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.5px;
        }
        .btn:hover {
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.9);
            transform: scale(1.03);
        }
        .btn:active {
            transform: scale(0.96);
        }
        /* Corações Néon Flutuantes */
        .coracao {
            position: absolute;
            color: #ff4d6d;
            pointer-events: none;
            text-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff758f, 0 0 30px #ff0055;
            animation: flutuar 3.8s cubic-bezier(0.1, 0.7, 0.25, 1) forwards;
            opacity: 0;
        }
        @keyframes flutuar {
            0% { transform: translateY(105vh) translateX(0) scale(0.4) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-15vh) translateX(var(--lateral)) scale(1.3) rotate(var(--rotacao)); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="music/music.m4a" type="audio/mpeg">
    </audio>

    <div class="container" id="caixa">
        <h1 id="titulo">Deixaram uma notificação exclusiva para ti aqui...👼</h1>
        <button class="btn" id="botao" onclick="revelarSurpresa()">Abrir Notificação</button>
        
        <div id="conteudo-secreto"></div>
    </div>

    <script>
        // Definido como o solicitado
        const nomeDela = "Miúda mais incrível"; 

        // Texto limpo sem tags internas para não falhar na digitação
        const textoPoetico = `No meio de tanta correria e de tantas distrações no dia a dia, há conexões que surgem para trazer leveza e fazer as coisas fazerem mais sentido.\n\nQueria apenas que soubesses, da forma mais sincera possível, que a tua presença acalma o meu caos e o teu sorriso consegue mudar o ritmo de qualquer dia comum. Tens uma energia única e cativante.\n\nPara mim, tu és a miúda mais incrível que já conheci, e poder partilhar momentos e conversas contigo é, sem dúvida, o meu detalhe favorito da rotina. Obrigado por seres exatamente quem és. ❤️`;

        function revelarSurpresa() {
            // Liga a música suave imediatamente
            const musica = document.getElementById('musica');
            musica.volume = 0.4; 
            musica.play().catch(e => console.log("Áudio aguardando permissão"));

            document.getElementById('botao').style.display = 'none';
            
            const titulo = document.getElementById('titulo');
            titulo.innerText = `Para a ${nomeDela}`;
            titulo.style.color = "#ff4d6d";
            titulo.style.fontWeight = "600";
            titulo.style.fontSize = "22px";
            titulo.style.textShadow = "0 0 15px rgba(255, 77, 109, 0.7)";

            // Inicia o efeito de máquina de escrever
            efeitoDigitacao(document.getElementById('conteudo-secreto'), textoPoetico, 0, () => {
                // Após terminar de digitar, envolve a frase importante no efeito néon automaticamente
                const containerTexto = document.getElementById('conteudo-secreto');
                containerTexto.innerHTML = containerTexto.innerHTML.replace(
                    "tu és a miúda mais incrível", 
                    '<span class="destaque">tu és a miúda mais incrível</span>'
                );


            // Cria e exibe a assinatura no final como um link para o WhatsApp
            const assinatura = document.createElement('a'); 
            assinatura.href = "https://wa.me/244952850762";
            assinatura.target = "_blank";

            // Estilos de assinatura: simples, discreta e elegante
            assinatura.style.textDecoration = "none"; 
            assinatura.style.color = "#ff4d6d"; 
            assinatura.style.fontFamily = "inherit"; // Usa a mesma fonte do texto
            assinatura.style.fontSize = "15px";      // Tamanho normal
            assinatura.style.display = "block"; 
            assinatura.style.marginTop = "30px";
            assinatura.style.textAlign = "right";
            assinatura.style.opacity = "0";          // Para o efeito de fade-in
            assinatura.style.transition = "opacity 1.2s ease";

            assinatura.innerText = "Com carinho, Luca_ duran";

            containerTexto.appendChild(assinatura);
            setTimeout(() => assinatura.style.opacity = "1", 100);
            });

            // Começa a disparar os corações mágicos
            setInterval(criarCoracao, 100);
        }

        function efeitoDigitacao(elemento, texto, i, callback) {
            if (i < texto.length) {
                if (texto.substring(i, i + 2) === '\n\n') {
                    elemento.innerHTML += '<br><br>';
                    i += 2;
                } else {
                    elemento.innerHTML += texto.charAt(i);
                    i++;
                }
                setTimeout(() => efeitoDigitacao(elemento, texto, i, callback), 40);
            } else if (callback) {
                callback();
            }
        }

        function criarCoracao() {
            const coracao = document.createElement('div');
            coracao.classList.add('coracao');
            
            const modelos = ['❤️', '💖', '✨', '❤️','😘'];
            coracao.innerText = modelos[Math.floor(Math.random() * modelos.length)];
            
            coracao.style.left = Math.random() * 100 + 'vw';
            coracao.style.setProperty('--lateral', (Math.random() * 80 - 40) + 'px');
            coracao.style.setProperty('--rotacao', (Math.random() * 360) + 'deg');
            
            const tamanhoAleatorio = (Math.random() * 18 + 16) + 'px';
            coracao.style.fontSize = tamanhoAleatorio;
            coracao.style.animationDuration = (Math.random() * 2 + 2.8) + 's'; 
            
            document.body.appendChild(coracao);

            setTimeout(() => {
                coracao.remove();
            }, 4000);
        }
    </script>
</body>
</html>
